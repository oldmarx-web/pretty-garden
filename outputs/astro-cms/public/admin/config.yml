# =============================================================
# 작은정원 (Pretty Garden) — Decap CMS 설정
#
# 배포 후 site_url / display_url / logo_url 의 도메인을 본인 사이트
# 주소로 바꿔주세요. 그 외 항목은 처음엔 그대로 두어도 됩니다.
# =============================================================

backend:
  name: git-gateway
  branch: main                    # 메인 브랜치 이름 (기본 main)

# 사이트 주소 (배포 후 수정)
site_url: https://prettygarden.netlify.app
display_url: https://prettygarden.netlify.app
logo_url: https://prettygarden.netlify.app/bi.jpg

# CMS 에서 업로드한 이미지가 저장될 폴더
media_folder: "public/uploads"
public_folder: "/uploads"

# 발행 모드 (simple = 저장 즉시 게시 / editorial_workflow = 초안→리뷰→게시)
publish_mode: simple

# 컬렉션 정의 — 좌측 사이드바 메뉴가 됩니다.
collections:

  # ───────────────────────────────────────────────
  # 1) 가드너 H의 편지 (비정기)
  # ───────────────────────────────────────────────
  - name: "letters"
    label: "가드너 H의 편지"
    label_singular: "편지"
    folder: "src/content/letters"
    create: true
    slug: "{{no}}-{{slug}}"
    summary: "No. {{no}} · {{title}}"
    sortable_fields: ['no', 'date']
    fields:
      - { name: "no", label: "회차 번호", widget: "number", value_type: "int", min: 1 }
      - { name: "date", label: "발행일", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: "title", label: "제목 (줄바꿈은 \\n)", widget: "string" }
      - { name: "photo", label: "사진 (선택)", widget: "image", required: false, hint: "비워두면 사진 없이 게시됩니다." }
      - { name: "photoAlt", label: "사진 설명 (대체 텍스트)", widget: "string", required: false }
      - { name: "signoff", label: "서명", widget: "string", default: "Gardener H" }
      - { name: "body", label: "본문 (마크다운)", widget: "markdown", hint: "소제목은 `#### [ 어젯밤 ]` 식으로 H4 헤딩 + 대괄호로 표시하세요. 자동으로 작은 헤더로 변환됩니다." }

  # ───────────────────────────────────────────────
  # 2) 소설 [걷는 듯 편안하게]
  # ───────────────────────────────────────────────
  - name: "novel"
    label: "소설 · 걷는 듯 편안하게"
    label_singular: "회차"
    folder: "src/content/novel"
    create: true
    slug: "{{no}}"
    summary: "No. {{no}} · {{episode}} · {{parts}}"
    sortable_fields: ['no', 'date']
    fields:
      - { name: "no", label: "회차 번호 (정렬용)", widget: "number", value_type: "int", min: 1 }
      - { name: "episode", label: "회 표시 (예: 1회)", widget: "string" }
      - { name: "date", label: "발행일", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "parts", label: "포함 파트 (예: Part 1—4)", widget: "string" }
      - { name: "preview", label: "미리보기 (펼치기 전 보이는 부분)", widget: "markdown", hint: "독자가 클릭하기 전 보이는 부분입니다." }
      - { name: "body", label: "본문 (펼친 후 이어 나오는 부분)", widget: "markdown", hint: "파트 구분점은 `### 2`, `### 3` 식으로 H3 헤딩 다음에 숫자만 적어주세요. 자동으로 큰 세리프 디바이더로 변환됩니다." }

  # ───────────────────────────────────────────────
  # 3) 도서 (Catalogue)
  # ───────────────────────────────────────────────
  - name: "books"
    label: "도서 목록"
    label_singular: "책"
    folder: "src/content/books"
    create: true
    summary: "{{order}}. {{title}} — {{author}}"
    sortable_fields: ['order', 'publishDate']
    fields:
      - { name: "order", label: "표시 순서 (작을수록 위)", widget: "number", value_type: "int", min: 1 }
      - { name: "title", label: "제목", widget: "string" }
      - { name: "author", label: "저자", widget: "string" }
      - { name: "authorRole", label: "저자 역할", widget: "select", options: ["글", "사진·글", "기획·글", "공저"], default: "글" }
      - { name: "genre", label: "분야", widget: "string", hint: "예: 시/에세이, 경제/경영, 소설 등" }
      - { name: "publishDate", label: "출간일", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "isbn", label: "ISBN (13자리)", widget: "string", pattern: ['^[0-9]{13}$', 'ISBN 13자리 숫자만 입력하세요.'] }
      - { name: "coverIsbn", label: "표지 ISBN (대부분 위와 동일)", widget: "string" }
      - { name: "kyoboId", label: "교보 상품 ID (예: S000219084109)", widget: "string", pattern: ['^S[0-9]+$', 'S 로 시작하는 ID 입력하세요.'] }
      - { name: "price", label: "가격 (원)", widget: "number", value_type: "int", min: 0 }
      - { name: "isNew", label: "신간 표시 (New 태그)", widget: "boolean", default: false }
      - { name: "tag", label: "추가 태그 (선택)", widget: "string", required: false }
      - { name: "description", label: "책 소개", widget: "text" }

  # ───────────────────────────────────────────────
  # 4) 저자
  # ───────────────────────────────────────────────
  - name: "authors"
    label: "저자 소개"
    label_singular: "저자"
    folder: "src/content/authors"
    create: true
    summary: "{{order}}. {{name}} — {{role}}"
    sortable_fields: ['order']
    fields:
      - { name: "order", label: "표시 순서", widget: "number", value_type: "int", min: 1 }
      - { name: "name", label: "이름", widget: "string" }
      - { name: "role", label: "역할 (예: Writer · Photographer)", widget: "string" }
      - { name: "works", label: "출간작 (한 줄에 한 권)", widget: "list", field: { name: "title", widget: "string" } }
      - { name: "body", label: "약력 / 소개", widget: "markdown" }

  # ───────────────────────────────────────────────
  # 5) 사이트 설정 (히어로 사진)
  # ───────────────────────────────────────────────
  - name: "settings"
    label: "사이트 설정"
    editor:
      preview: false
    files:
      - name: "hero"
        label: "히어로 (메인 사진 영역)"
        file: "src/content/settings/hero.md"
        fields:
          - { name: "heroPhoto", label: "히어로 사진", widget: "image", hint: "메인 페이지 상단에 크게 들어갈 사진입니다." }
          - { name: "heroPhotoAlt", label: "사진 설명 (대체 텍스트)", widget: "string" }
          - { name: "heroPhotoCaption", label: "캡션 (사진 아래 한 줄)", widget: "string" }
          - { name: "heroPhotoDate", label: "캡션 우측 날짜 (예: Photo · 2026. 04. 13)", widget: "string" }
